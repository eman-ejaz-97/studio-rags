services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: studio_rags_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio_rags}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-studio}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
