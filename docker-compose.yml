services:
  postgres:
    image: postgres:17-alpine
    container_name: studio_rags_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio_rags}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-studio}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outbound email in development so nothing reaches a real
  # inbox. Web UI on http://localhost:8025, SMTP on :1025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: studio_rags_mail
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  postgres_data:
